name: Sync to AWS CodeCommit

on:
  push:
    branches:
      - codecommit

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Mark workspace as safe for git
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Some actions/tools still touch /github/workspace directly
          git config --global --add safe.directory /github/workspace
          # Useful for debugging:
          git config --global --get-all safe.directory
      - name: Sync to CodeCommit
        uses: youyo/sync-up-to-codecommit-action@v1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          repository_name: my-china-branch
          aws_region: us-east-1
