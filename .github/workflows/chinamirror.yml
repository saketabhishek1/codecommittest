name: Mirror Repo

on:
  push:
    branches:
      - main
      - codecommit

    paths-ignore:
      - "**/*.md"

  workflow_dispatch:

concurrency:
  group: mirror-repo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror-codecommit-dev:
    name: Mirror to China CodeCommit Dev Account
    runs-on: [self-hosted, linux, arm64, philips-code-hub, ubuntu-2404]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone bare repository
        run: |
          git clone --bare "https://x-access-token:${GITHUB_TOKEN}@github.com/${GIT_REPOSITORY_GITHUB}.git" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws-cn:iam::${{ vars.AWS_DEV_ACCOUNT_ID }}:role/github.com/${{ github.event.repository.name }}-mirror
          aws-region: cn-northwest-1
          role-session-name: eng-iam-workflow-role-global


      - name: Setup Git Credentials Helper
        run: |
          git config --global credential.helper '!aws codecommit credential-helper $@'
          git config --global credential.UseHttpPath true

      - name: Mirror to CodeCommit
        run: |
          git push --mirror "https://git-codecommit.cn-northwest-1.amazonaws.com.cn/v1/repos/${GIT_REPOSITORY_CM##*/}"

  mirror-codecommit-prod:
    name: Mirror to China CodeCommit Prod Account
    runs-on: [self-hosted, linux, arm64, philips-code-hub, ubuntu-2404]
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone bare repository
        run: |
          git clone --bare "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup AWS credentials for Shared Services Prod Account
        uses: aws-actions/configure-aws-credentials@bb84b6db015d7c3d879540350fdc17b85d6ad362 # v5.1.0
        with:
          role-to-assume: arn:aws-cn:iam::${{ vars.AWS_PROD_ACCOUNT_ID }}:role/github.com/${{ github.event.repository.name }}-mirror
          aws-region: cn-northwest-1
          role-session-name: github-actions-mirror

      - name: Setup Git Credentials Helper
        run: |
          git config --global credential.helper '!aws codecommit credential-helper $@'
          git config --global credential.UseHttpPath true

      - name: Mirror to CodeCommit
        run: |
          git push --mirror "https://git-codecommit.cn-northwest-1.amazonaws.com.cn/v1/repos/${GITHUB_REPOSITORY##*/}"
